name: agentd

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentd
      POSTGRES_PASSWORD: agentd
      POSTGRES_DB: agentd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentd -d agentd"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Traces land here from M4 onward; wired into compose now so the endpoint
  # is stable for the whole build.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["serve", "-addr", ":8080"]
    environment:
      AGENTD_DSN: postgres://agentd:agentd@postgres:5432/agentd?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["work"]
    environment:
      AGENTD_DSN: postgres://agentd:agentd@postgres:5432/agentd?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
