name: agentd

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentd
      POSTGRES_PASSWORD: agentd
      POSTGRES_DB: agentd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentd -d agentd"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Traces land here from M4 onward; wired into compose now so the endpoint
  # is stable for the whole build.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

  # Scrapes both processes so the counters are something to look at rather
  # than a text endpoint nobody opens. Cut this service and everything still
  # works: /metrics is served either way.
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["serve", "-addr", ":8080"]
    environment:
      AGENTD_DSN: postgres://agentd:agentd@postgres:5432/agentd?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      AGENTD_JAEGER_UI: ${AGENTD_JAEGER_UI:-http://localhost:16686}
    ports:
      - "8080:8080"
    # The binary probes itself: the runtime image is distroless, so there is
    # no curl and no shell to run one from.
    healthcheck:
      test: ["CMD", "/agentd", "healthz", "-addr", "localhost:8080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # The model runs on the host, not in compose: Docker Desktop on macOS has
  # no GPU passthrough, so Ollama in a container would be CPU-only. The
  # worker reaches the host's Ollama through host.docker.internal.
  #
  # Sandboxed tool calls run as sibling containers on the host daemon
  # ("Docker outside of Docker"): the worker talks to the daemon through the
  # mounted socket, and the sandbox image must exist on that daemon
  # (`make sandbox-build`, which `make up` runs first). The socket grants
  # root-equivalent control of the host; see docs/SECURITY.md.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["work"]
    environment:
      AGENTD_DSN: postgres://agentd:agentd@postgres:5432/agentd?sslmode=disable
      AGENTD_MODEL_URL: ${AGENTD_MODEL_URL:-http://host.docker.internal:11434/v1}
      AGENTD_MODEL: ${AGENTD_MODEL:-qwen2.5:7b}
      AGENTD_SANDBOX_IMAGE: ${AGENTD_SANDBOX_IMAGE:-agentd/sandbox:python}
      AGENTD_SANDBOX_TIMEOUT: ${AGENTD_SANDBOX_TIMEOUT:-30s}
      AGENTD_SANDBOX_MAX_TIMEOUT: ${AGENTD_SANDBOX_MAX_TIMEOUT:-120s}
      # Retrieval (M3). The embedder defaults to the model URL: Ollama serves
      # chat and embeddings from one port. The reranker runs on the local
      # model; AGENTD_RERANK=off disables it.
      AGENTD_EMBED_URL: ${AGENTD_EMBED_URL:-}
      AGENTD_EMBED_MODEL: ${AGENTD_EMBED_MODEL:-mxbai-embed-large}
      AGENTD_RERANK: ${AGENTD_RERANK:-on}
      AGENTD_RERANK_MODEL: ${AGENTD_RERANK_MODEL:-}
      # Optional. Runs whose agent_config.model is "anthropic/..." or a bare
      # "claude-*" name go to the Anthropic API; without a key those runs
      # fail with an authentication error and local runs are unaffected.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTD_ANTHROPIC_PRICES: ${AGENTD_ANTHROPIC_PRICES:-}
      AGENTD_ANTHROPIC_THINKING_DISPLAY: ${AGENTD_ANTHROPIC_THINKING_DISPLAY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      AGENTD_METRICS_ADDR: ${AGENTD_METRICS_ADDR:-:9091}
      AGENTD_CANCEL_POLL: ${AGENTD_CANCEL_POLL:-1s}
    # Deliberately no host port on the left: spec §2's lease demo runs
    # `docker compose up --scale worker=2`, and a fixed host port collides on
    # the second replica. Compose assigns an ephemeral one per replica, which
    # `docker compose port worker 9091` resolves when a human needs it, while
    # Prometheus scrapes the container port over the compose network.
    ports:
      - "9091"
    healthcheck:
      test: ["CMD", "/agentd", "healthz", "-addr", "localhost:9091"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
