# Scrape config for the compose stack. Both agentd processes expose
# /metrics: the API on its own listener, the worker on -metrics-addr.
global:
  # Runs are minutes long and the interesting counters move a few times a
  # minute, so 15s is already finer than the signal.
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: agentd-api
    static_configs:
      - targets: ["api:8080"]

  - job_name: agentd-worker
    # DNS discovery rather than a static target, because the worker is the
    # service that scales: `docker compose up --scale worker=2` gives the
    # name several A records, and a static target would resolve to one of
    # them per scrape and silently report half the fleet's counters as a
    # flapping whole. Discovery makes each replica its own target.
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9091
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
