  # ---- new cases (label_status: draft) ----

  - query: "15 U.S.C. § 1681m(a) when is an insurance rate increase based on a credit report"
    category: citation
    relevant:
      - {source_id: "cap-3573430", paragraph_ordinal: 30, evidence: "consideration of the report must be a necessary condition for the increased rate"}
      - {source_id: "cap-3573430", paragraph_ordinal: 31, evidence: "indicates a but-for causal relationship and thus a necessary logical condition"}
      - {source_id: "cap-3573430", paragraph_ordinal: 33, evidence: "the duty to report arises from some practical consequence of reading the report"}
      - {source_id: "cap-3573430", paragraph_ordinal: 36, evidence: "only when the effect of the credit report on the initial rate offered is necessary to put the consumer in a worse position"}
    label_status: draft
    notes: "Paragraphs 30-31 answer the question directly. 33 (the reasoning for the necessary-condition reading) and 36 (the neutral-score baseline) are partially relevant and were added. The corpus prints the cite as '15 U. S. C. § 1681m(a)'."

  - query: "28 U.S.C. § 994(h) maximum term authorized includes statutory recidivist enhancements"
    category: citation
    relevant:
      - {source_id: "cap-11652916", paragraph_ordinal: 2, evidence: "hold that “maximum term authorized” must be read to include all applicable statutory sentencing enhancements"}
      - {source_id: "cap-11652916", paragraph_ordinal: 22, evidence: "the phrase “maximum term authorized” should be construed as requiring the “highest” or “greatest” sentence allowed by statute"}
      - {source_id: "cap-11652916", paragraph_ordinal: 23, evidence: "the “maximum term authorized” for the qualifying repeat offenders is the enhanced, not the base, term"}
      - {source_id: "cap-11652916", paragraph_ordinal: 25, evidence: "for defendants who have received the notice under § 851(a)(1), as respondents did here, the “maximum term authorized” is the enhanced term"}
      - {source_id: "cap-3674133", paragraph_ordinal: 26, evidence: "We held that the phrase “maximum term authorized” “refers to all applicable statutes,” including recidivist enhancements."}
    label_status: draft
    notes: "United States v. Rodriquez ¶26 restates LaBonte's holding while construing ACCA; it is partially relevant and was added. Kimbrough ¶35 and Almendarez-Torres ¶19 cite § 994(h) only in passing and were left out."

  - query: "42 U.S.C. § 1396p(a) anti-lien provision and a state's claim on a Medicaid beneficiary's tort settlement"
    category: citation
    relevant:
      - {source_id: "cap-12407746", paragraph_ordinal: 2, evidence: "The anti-lien provision pre-empts a State’s effort to take any portion of a Medicaid beneficiary’s tort judgment or settlement not “designated as payments for medical care.”"}
      - {source_id: "cap-12407746", paragraph_ordinal: 47, evidence: "The Medicaid anti-lien provision, 42 U. S. C. § 1396p(a)(l), bars that result."}
      - {source_id: "cap-3276324", paragraph_ordinal: 45, evidence: "Her argument, rather, is that the anti-lien provision precludes attachment or encumbrance of the remainder of the settlement"}
      - {source_id: "cap-3276324", paragraph_ordinal: 38, evidence: "prohibits States (except in circumstances not relevant here) from placing liens against, or seeking recovery of benefits paid from, a Medicaid recipient"}
      - {source_id: "cap-12407746", paragraph_ordinal: 14, evidence: "“[n]o lien may be imposed against the property of any individual prior to his death on account of medical assistance paid"}
    label_status: draft
    notes: "Two documents (Wos, Ahlborn). Wos ¶14 and Ahlborn ¶38 quote or describe the provision without applying it, so they are partially relevant and were added. OCR in the corpus renders (a)(1) as '(a)(l)', so this query uses '§ 1396p(a)', the form that appears literally in Ahlborn ¶63."

  - query: "26 U.S.C. § 6321 federal tax lien on an inheritance the taxpayer disclaimed under state law"
    category: citation
    relevant:
      - {source_id: "cap-9476074", paragraph_ordinal: 2, evidence: "After the passage of several months, Drye disclaimed his interest in his mother"}
      - {source_id: "cap-9476074", paragraph_ordinal: 3, evidence: "We hold that the disclaimer did not defeat the federal tax liens."}
      - {source_id: "cap-9476074", paragraph_ordinal: 30, evidence: "The control rein he held under state law, we hold, rendered the inheritance “property” or “rights to property” belonging to him"}
      - {source_id: "cap-9476074", paragraph_ordinal: 28, evidence: "This power to channel the estate’s assets warrants the conclusion that Drye held “property”"}
    label_status: draft
    notes: "§ 6321 appears in 10 documents, but only Drye addresses disclaimers. ¶28 is the disclaimer-versus-rejected-gift reasoning; it is partially relevant and was added."

  - query: "11 U.S.C. § 523(a)(2)(A) what level of reliance must a creditor show"
    category: citation
    relevant:
      - {source_id: "cap-323761", paragraph_ordinal: 35, evidence: "we hold that § 523(a)(2)(A) requires justifiable, but not reasonable, reliance"}
      - {source_id: "cap-323761", paragraph_ordinal: 2, evidence: "we consider the level of a creditor’s reliance on a fraudulent misrepresentation necessary to place a debt thus beyond release"}
      - {source_id: "cap-323761", paragraph_ordinal: 24, evidence: "what, if any, level of justification a creditor needs to show above mere reliance in fact"}
      - {source_id: "cap-323761", paragraph_ordinal: 43, evidence: "the Bankruptcy Court’s requirement of reasonableness clearly exceeds the demand of justifiable reliance"}
      - {source_id: "cap-3674023", paragraph_ordinal: 38, evidence: "some degree of reliance is required to satisfy the element of causation inherent in the phrase ‘obtained by’"}
    label_status: draft
    notes: "Bridge v. Phoenix Bond ¶38 quotes Field v. Mans on reliance in a RICO case; it is partially relevant and was added. Cohen v. de la Cruz (16 paragraphs citing the section) is about damages, not reliance, and was left out."

  - query: "8 U.S.C. § 1231(a)(6) detention of inadmissible aliens beyond the 90-day removal period"
    category: citation
    relevant:
      - {source_id: "cap-3442797", paragraph_ordinal: 12, evidence: "applies without differentiation to all three categories of aliens that are its subject"}
      - {source_id: "cap-3442797", paragraph_ordinal: 2, evidence: "the Secretary’s authority to continue to detain an inadmissible alien subject to a removal order after the 90-day removal period has elapsed"}
      - {source_id: "cap-9313599", paragraph_ordinal: 31, evidence: "It sets no “limit on the length of time beyond the removal period that an alien who falls within one of the Section 1231(a)(6) categories may be detained.”"}
      - {source_id: "cap-9031152", paragraph_ordinal: 30, evidence: "that alien “may be detained beyond the removal period” in the discretion of the Attorney General"}
    label_status: draft
    notes: "Clark v. Martinez is the direct answer. Zadvydas ¶31 (the Government's no-time-limit reading, for admitted aliens) and Demore v. Kim ¶30 (a summary of the statute) are partially relevant and were added. Zadvydas's own holding is about admitted aliens and may deserve its own label; reviewer should decide."

  - query: "28 U.S.C. § 636(b)(1)(B) prisoner petitions challenging conditions of confinement isolated incident"
    category: citation
    relevant:
      - {source_id: "cap-6218684", paragraph_ordinal: 2, evidence: "whether that authorization includes cases alleging a specific episode of unconstitutional conduct by prison administrators"}
      - {source_id: "cap-6218684", paragraph_ordinal: 14, evidence: "unambiguously embraced the kind of single episode cases that petitioner’s construction would exclude"}
      - {source_id: "cap-6218684", paragraph_ordinal: 16, evidence: "were all challenges to specific instances of unconstitutional conduct"}
      - {source_id: "cap-9108401", paragraph_ordinal: 19, evidence: "the pathmarking opinion is McCarthy v. Bronson, 500 U. S. 136 (1991), which construed 28 U. S. C. § 636(b)(1)(B)"}
      - {source_id: "cap-9108401", paragraph_ordinal: 20, evidence: "We found no suggestion in § 636(b)(1)(B) that Congress meant to divide prisoner petitions “into subcategories.”"}
    label_status: draft
    notes: "Porter v. Nussle ¶19-20 recount McCarthy's reading while construing the PLRA; they are partially relevant and were added. Gomez v. United States cites the subsection for dispositive motions, an unrelated sense, and was left out."

  - query: "11 U.S.C. § 522(l) trustee objection to claimed exemption after 30 days"
    category: citation
    relevant:
      - {source_id: "cap-6237415", paragraph_ordinal: 2, evidence: "whether the trustee may contest the validity of an exemption after the 30-day period if the debtor had no colorable basis for claiming the exemption"}
      - {source_id: "cap-6237415", paragraph_ordinal: 15, evidence: "We hold, however, that his failure to do so prevents him from challenging the validity of the exemption now."}
      - {source_id: "cap-6237415", paragraph_ordinal: 19, evidence: "Taylor cannot contest the exemption at this time whether or not Davis had a colorable statutory basis for claiming it."}
      - {source_id: "cap-6237415", paragraph_ordinal: 22, evidence: "We have no authority to limit the application of § 522(l) to exemptions claimed in good faith."}
      - {source_id: "cap-3641718", paragraph_ordinal: 15, evidence: "what constitutes a claim of exemption to which an interested party must object under §522(l)"}
    label_status: draft
    notes: "Schwab v. Reilly ¶15 is on a neighboring question (what counts as a claimed exemption); it is partially relevant and was added."

  - query: "29 U.S.C. § 1103(c)(1) anti-inurement provision employer use of pension plan surplus"
    category: citation
    relevant:
      - {source_id: "cap-11076610", paragraph_ordinal: 23, evidence: "Hughes could not have violated the anti-inurement provision under ERISA § 403(e)(1)"}
      - {source_id: "cap-11076610", paragraph_ordinal: 21, evidence: "permitted Hughes to use assets from the surplus attributable to employer and employee contributions for its sole and exclusive benefit"}
      - {source_id: "cap-11076610", paragraph_ordinal: 10, evidence: "Hughes had violated ERISA’s anti-inurement prohibition"}
      - {source_id: "cap-5882913", paragraph_ordinal: 47, evidence: "The provision demands only that plan assets be held for supplying benefits to plan participants."}
    label_status: draft
    notes: "Yates v. Hendon ¶47 construes the same provision for working owners, not surplus; it is partially relevant and was added. Boggs v. Boggs ¶34 and ¶41 only paraphrase the text and were left out."

  - query: "21 U.S.C. § 802(44) felony drug offense state misdemeanor punishable by more than one year"
    category: citation
    relevant:
      - {source_id: "cap-3674213", paragraph_ordinal: 4, evidence: "A state drug offense punishable by more than one year therefore qualifies as a “felony drug offense,” even if state law classifies the offense as a misdemeanor."}
      - {source_id: "cap-3674213", paragraph_ordinal: 2, evidence: "whether a state drug offense classified as a misdemeanor, but punishable by more than one year’s imprisonment, is a “felony drug offense”"}
      - {source_id: "cap-3674213", paragraph_ordinal: 20, evidence: "The Government’s reading, we are convinced, correctly interprets the statutory text and context."}
      - {source_id: "cap-3674213", paragraph_ordinal: 21, evidence: "Congress used the phrase “felony drug offense” as a term of art defined by §802(44) without reference to §802(13)"}
    label_status: draft
    notes: "Single-document case: Burgess is the only document citing § 802(44), in 23 paragraphs. ¶20-21 are the start of the reasoning. Later paragraphs (22-28) develop it further and are arguably partially relevant too; only the first two were labeled."

  - query: "28 U.S.C. § 1915(d) is an in forma pauperis complaint that fails Rule 12(b)(6) automatically frivolous"
    category: citation
    relevant:
      - {source_id: "cap-605680", paragraph_ordinal: 2, evidence: "is automatically frivolous within the meaning of 28 U. S. C. § 1915(d). The answer, we hold, is no."}
      - {source_id: "cap-605680", paragraph_ordinal: 18, evidence: "dismissal on Rule 12(b)(6) grounds is appropriate, but dismissal on the basis of frivolousness is not"}
      - {source_id: "cap-605680", paragraph_ordinal: 13, evidence: "a complaint, containing as it does both factual allegations and legal conclusions, is frivolous where it lacks an arguable basis either in law or in fact"}
      - {source_id: "cap-11727595", paragraph_ordinal: 15, evidence: "Neitzke v. Williams, supra, provided us with our first occasion to construe the meaning of “frivolous” under § 1915(d)."}
    label_status: draft
    notes: "Neitzke ¶13 (the frivolousness definition) and Denton v. Hernandez ¶15 (a restatement of Neitzke) are partially relevant and were added. Mallard v. U.S. District Court cites § 1915(d) for appointing counsel, an unrelated sense."

  - query: "42 U.S.C. § 406(b) contingent-fee agreement versus lodestar for Social Security attorney fees"
    category: citation
    relevant:
      - {source_id: "cap-353782", paragraph_ordinal: 2, evidence: "Is the contingent-fee agreement between claimant and counsel, if not in excess of 25 percent of past-due benefits, presumptively reasonable?"}
      - {source_id: "cap-353782", paragraph_ordinal: 3, evidence: "Congress, we conclude, designed § 406(b) to control, not to displace, fee agreements"}
      - {source_id: "cap-353782", paragraph_ordinal: 34, evidence: "§ 406(b) does not displace contingent-fee agreements as the primary means by which fees are set"}
      - {source_id: "cap-353782", paragraph_ordinal: 37, evidence: "We hold that § 406(b) does not displace contingent-fee agreements within the statutory ceiling"}
      - {source_id: "cap-353782", paragraph_ordinal: 17, evidence: "the court employed for the § 406(b) fee calculation a “lodestar” method"}
