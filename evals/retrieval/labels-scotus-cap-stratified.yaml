# Stratified retrieval eval set for the Caselaw Access Project SCOTUS corpus
# (data/corpus/scotus-cap-dedup.jsonl, 2,484 documents; spec §9, §12).
#
# WHY THIS FILE EXISTS. Every case in labels-scotus-cap.yaml is a paraphrased
# question, and paraphrases favor vector search. This file keeps those 40 cases
# (copied verbatim, with `category: paraphrase` added) and adds cases that stress
# exact-term matching, so the vector / BM25 / hybrid / hybrid+rerank comparison
# is not decided by what kind of question was asked. Categories:
#
#   paraphrase   conceptual question whose wording does not match the source
#   citation     includes a statute or reporter citation found in the corpus
#   case_name    names a case that corpus opinions cite
#   term_of_art  built around a legal term used in the relevant passage
#   mixed        conceptual question that also names a citation or case
#
# WHY A SEPARATE FILE. internal/retrieval/eval.ReadLabels decodes with
# KnownFields(true) and knows only query/relevant{source_id, ordinals}. The
# fields below (category, paragraph_ordinal, evidence, label_status, notes)
# would make `make eval-retrieval` reject labels-scotus-cap.yaml, and every
# label here is an unreviewed draft. So this file stands alongside the scored
# file rather than replacing it, and nothing reads it except
# stratified_labels_test.go. Scoring it requires (a) the loader to accept these
# fields and (b) the scorer to map paragraph ordinals to chunks, which
# chunks.char_start/char_end make possible.
#
# PARAGRAPH ORDINALS. A paragraph ordinal is a 0-based index into the
# document's `text` split on "\n", skipping blank lines. CAP text has no blank
# lines, so the ordinal is simply the line number. It is NOT chunks.ordinal:
# the chunker splits on blank lines, CAP has none, so it splits by sentence into
# about 28 chunks per document. Labels keyed to (source_id, paragraph_ordinal)
# survive re-chunking. The 40 paraphrase cases keep their document-level labels
# (source_id only), as they were written.
#
# Each new `relevant` entry carries `evidence`: an excerpt under 30 words copied
# verbatim from that paragraph (OCR errors included, e.g. "ease" for "case",
# "(a)(l)" for "(a)(1)"). The validation test checks every excerpt against the
# corpus, which catches an off-by-one ordinal.
#
# METHOD, AND WHAT WAS AND WAS NOT DONE.
# - No retriever was run (vector, BM25, hybrid, or rerank) while choosing or
#   labeling cases. No results files were consulted.
# - Source documents came from a positional sample (every 25th document from
#   offset 7) plus documents they cite or are cited by. Each query was written
#   after reading the opinion's own question-presented and holding paragraphs.
# - To make citation, case_name and term_of_art labels complete, the raw JSONL
#   was scanned with exact-substring or regex matching for the identifier or
#   term, and every hit was read before it was labeled or rejected. This is
#   lexical matching over raw text, not a retriever, but it has a known bias:
#   a paragraph that discusses the concept without the identifier can be
#   missed. For the main document of each case, neighboring paragraphs were
#   read to reduce that risk. mixed cases were labeled by reading the main
#   opinion's holding and every later corpus paragraph citing it by name.
# - Partially relevant paragraphs are included in `relevant`, not left out, and
#   each case's `notes` names them. Paragraphs considered and rejected are also
#   named in `notes` so a reviewer can overrule the call.
# - Some CAP documents include concurrences and dissents after the majority
#   (about 117 documents have a separate-opinion header); where a label lands in
#   one, `notes` says so.
# - These cases were written by a language model, as were the 40 before them.
#   All new labels are `label_status: draft` pending hand review.
#
# SPREAD. 103 cases; no document backs more than 5 (Zadvydas v. Davis, mostly as
# a partial label). No other document backs more than 3.

thresholds:
  hybrid: {recall_at_8: 0.70}
  hybrid_rerank: {recall_at_8: 0.70}

