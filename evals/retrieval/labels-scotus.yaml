# Hand-labeled retrieval queries for the real CourtListener corpus.
#
# SUPERSEDED by labels-scotus-cap.yaml. The corpus this file labels was 84
# documents because CourtListener's free tier allows 125 API requests a day;
# the benchmark now runs against 2,484 SCOTUS merits opinions pulled from the
# Caselaw Access Project, where top-8 is a selective slice rather than the top
# 9.5% of everything there is. See ADR-40. This file is kept, and its ids are
# still valid against `data/corpus/scotus-dedup.jsonl`, because the corpus it
# describes is the one `results-scotus.json` was measured on and a result whose
# inputs have been deleted is not a result.
#
# 84 distinct SCOTUS cases, one document each. evals/retrieval/labels.yaml is
# the 12-opinion smoke fixture that runs anywhere in seconds and saturates;
# this is the set that discriminates between the four modes.
#
# METHOD. Cases were picked off the corpus listing by id, and each query was
# written from that opinion's own syllabus — never from search results. That
# ordering is the anti-bias rule in labels.yaml, and it matters far more at
# this scale than at 48 chunks: a query written by reading what already ranks
# first measures the ranker against itself.
#
# CAVEAT, stated because the table is worth less without it: these queries were
# written by a language model, not by a lawyer. They are faithful to the
# syllabus each was drawn from, and phrased as an agent would ask rather than as
# keywords — which is the shape that exposed the websearch_to_tsquery AND-
# semantics bug. But a model wrote them, and the system being scored is the same
# kind of system. Treat this as a well-constructed benchmark, not as a human-
# labeled gold set.
#
# DUPLICATES, and why the corpus is 84 documents and not 109. CourtListener
# returns each revision of an opinion as its own document with its own id: the
# 109 fetched documents covered only 84 cases, and Trump v. CASA appeared five
# times — 10.8% of the corpus by itself. Deduplication happens at the source
# (see `agentd fetch -dedupe`, ADR-39) rather than in the ingest pipeline,
# keyed on the docket number, keeping the longest text per docket. Note that
# content-hash deduplication would not have caught any of it: all 109 texts
# differ, because a revision is a genuinely different document.
#
# With one document per case, exactly one document is relevant per query. The
# earlier version of this file listed every duplicate id as relevant, which gave
# a query up to five chances to land in top-8 and inflated recall; labeling a
# single id against the duplicated corpus would have scored the copies as
# misses and deflated it. Deduplicating the corpus is what makes one-relevant-
# doc-per-query the correct labeling rather than a choice between two biases.
#
# Thresholds are the same 0.70 recall@8 the fixture uses, set before the first
# run rather than fitted to the numbers it produced.

thresholds:
  hybrid: {recall_at_8: 0.70}
  hybrid_rerank: {recall_at_8: 0.70}

cases:
